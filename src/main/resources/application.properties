spring.application.name=document-qa

# ---------------------------------------------------------------------------
# Generation model: Claude (cloud), same as project one.
# API key comes from the ANTHROPIC_API_KEY environment variable - never here.
# ---------------------------------------------------------------------------
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=claude-haiku-4-5
spring.ai.anthropic.chat.temperature=0.3
spring.ai.anthropic.chat.max-tokens=1024

# ---------------------------------------------------------------------------
# Embedding model: nomic-embed-text, running locally via Ollama.
# This turns text into 768-dimensional vectors. The dimension (768) MUST match
# the pgvector 'dimensions' setting below - mismatch is the classic RAG bug.
# ---------------------------------------------------------------------------
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text
# Pull the model automatically if it isn't present yet.
spring.ai.ollama.init.pull-model-strategy=when_missing
# Our chat/generation is Claude, not Ollama - don't pull an Ollama chat model.
spring.ai.ollama.init.chat.include=false

# We use Claude (Anthropic) as the only chat model. The Ollama starter also
# auto-configures an Ollama *chat* model, which creates two chat models and an
# ambiguous ChatClient.Builder. Exclude the Ollama chat auto-config so only its
# embedding model remains active.
spring.autoconfigure.exclude=org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration

# ---------------------------------------------------------------------------
# Vector store: PostgreSQL + pgvector (running in Docker).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/vectordb
spring.datasource.username=postgres
spring.datasource.password=postgres

# Let Spring AI create the vector_store table and extension on startup.
spring.ai.vectorstore.pgvector.initialize-schema=true
# 768 to match nomic-embed-text's output dimension.
spring.ai.vectorstore.pgvector.dimensions=768
# HNSW = fast approximate nearest-neighbour index; cosine = standard similarity measure.
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# ---------------------------------------------------------------------------
# Allow larger file uploads for the /ingest endpoint (PDFs can be big).
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB